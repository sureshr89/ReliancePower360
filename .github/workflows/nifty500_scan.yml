name: NIFTY 500 Daily Scanner

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "scan = generate morning data, eod = EOD audit"
        required: false
        default: "scan"
        type: choice
        options:
          - scan
          - eod
  schedule:
    - cron: "30 3 * * 1-5"
    - cron: "10 10 * * 1-5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Generate scan
        env:
          MODE: ${{ github.event.inputs.mode || 'scan' }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          echo "MODE=$MODE"
          echo "EVENT_SCHEDULE=$EVENT_SCHEDULE"
          if [ "$MODE" = "eod" ] || [ "$EVENT_SCHEDULE" = "10 10 * * 1-5" ]; then
            python nifty500_eod.py
          else
            python nifty500_scanner.py
          fi
          echo "----- DATA DIRECTORY -----"
          mkdir -p data
          ls -la data
          test -f data/nifty500_scan.csv || echo "nifty500_scan.csv not generated in this run"
          test -f data/nifty500_report.json || echo "nifty500_report.json not generated in this run"

      - name: Commit generated data
        run: |
          git config user.name "ReliancePower360 Bot"
          git config user.email "actions@github.com"
          mkdir -p data
          git add -f data/
          if git diff --cached --quiet; then
            echo "No generated data changes to commit"
          else
            git commit -m "Update NIFTY 500 daily intelligence"
            git push origin HEAD:${{ github.ref_name }}
          fi
