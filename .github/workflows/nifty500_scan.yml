name: NIFTY 500 Daily Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1-5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run NIFTY scanner
        run: python nifty500_scanner.py

      - name: Verify generated files
        run: |
          test -s data/nifty500_scan.csv
          test -s data/nifty500_report.json
          echo "Generated files:"
          ls -lh data/

      - name: Commit scan data
        run: |
          git config user.name "ReliancePower360 Bot"
          git config user.email "actions@github.com"
          git add -f data/nifty500_scan.csv data/nifty500_report.json
          git diff --cached --quiet && echo "No data changes" || (git commit -m "Update NIFTY 500 daily scan" && git push origin main)
