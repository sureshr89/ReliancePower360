name: NIFTY 500 Daily Intelligence

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose morning prediction or 5 PM EOD audit"
        required: true
        default: "scan"
        type: choice
        options:
          - scan
          - eod
  schedule:
    - cron: "30 3 * * 1-5"
    - cron: "30 11 * * 1-5"

permissions:
  contents: write

jobs:
  intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run morning prediction or EOD audit
        env:
          MODE: ${{ github.event.inputs.mode || '' }}
          SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          if [ "$MODE" = "eod" ] || [ "$SCHEDULE" = "30 11 * * 1-5" ]; then
            python nifty500_eod.py
          else
            python nifty500_scanner.py
          fi

      - name: Verify generated data and news evidence
        run: |
          mkdir -p data
          ls -lh data/
          python - <<'PY'
          import json, pandas as pd
          r=json.load(open("data/nifty500_report.json"))
          print("NEWS ARTICLES SAVED:", r.get("news_articles_saved"))
          n=pd.read_csv("data/nifty500_prediction_news.csv")
          print("NEWS ROWS:", len(n))
          if len(n)==0:
              print("WARNING: No dated news evidence was collected")
          else:
              print(n[["ticker","published_date","published_at","source","title","sentiment"]].head(20).to_string(index=False))
          PY

      - name: Commit intelligence data
        run: |
          git config user.name "ReliancePower360 Bot"
          git config user.email "actions@github.com"

          # IMPORTANT: preserve files generated by this run. The previous version
          # reset the checkout before staging, which could erase the fresh EOD audit.
          SNAPSHOT_DIR="$(mktemp -d)"
          cp -a data/. "$SNAPSHOT_DIR/"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            mkdir -p data
            cp -a "$SNAPSHOT_DIR/." data/

            git add -f data/
            if git diff --cached --quiet; then
              echo "No generated data changes"
              exit 0
            fi

            git commit -m "Update NIFTY 500 intelligence"
            if git push origin HEAD:main; then
              echo "Generated data pushed successfully"
              exit 0
            fi

            echo "Push attempt $attempt lost a concurrent update; preserving snapshot and retrying..."
            sleep $((attempt * 2))
          done

          echo "Unable to push generated intelligence after retries"
          exit 1
