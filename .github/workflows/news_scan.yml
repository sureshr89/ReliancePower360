name: Reliance Power 360 News Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

concurrency:
  group: reliance-power-360-scan
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run analysis
        run: python run_analysis.py

      - name: Verify generated data
        run: |
          test -f data/latest_report.json
          test -f data/latest_news.csv
          python - <<'PY'
          import json, pandas as pd
          r=json.load(open("data/latest_report.json", encoding="utf-8"))
          n=pd.read_csv("data/latest_news.csv")
          print("Generated:", r.get("generated_at"))
          print("Articles:", len(n))
          print("Outlook:", r.get("summary", {}).get("news_outlook"))
          PY

      - name: Commit updated intelligence data
        run: |
          git config user.name "ReliancePower360 Bot"
          git config user.email "actions@github.com"
          git add data/latest_report.json data/latest_news.csv
          [ -f data/signal_history.csv ] && git add data/signal_history.csv || true
          [ -f data/price_history.csv ] && git add data/price_history.csv || true
          [ -f data/forecast_audit.csv ] && git add data/forecast_audit.csv || true
          git diff --cached --quiet || git commit -m "Update Reliance Power 360 intelligence"
          git push
