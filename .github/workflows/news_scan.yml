name: Reliance Power 360 News Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis
        run: python run_analysis.py

      - name: Commit updated intelligence data
        run: |
          git config user.name "ReliancePower360 Bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update Reliance Power 360 intelligence"
          git push
